<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>구름이·노을이 새 옷 시안</title>
<style>
  @font-face { font-family: G; src: url('../assets/fonts/Galmuri11-Bold.woff2'); }
  body { margin: 0; padding: 24px 32px; background: #9ce0ff; font-family: G, sans-serif; color: #1a1020; }
  h1 { font-size: 33px; margin: 0 0 6px; }
  p { font-size: 22px; margin: 0 0 18px; }
  .sec { background: #fff8ec; border: 6px solid #1a1020; box-shadow: 12px 12px 0 #000; padding: 14px 20px 6px; margin-bottom: 28px; }
  .sec h2 { font-size: 22px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; font-size: 15px; }
  canvas { width: 192px; height: 216px; image-rendering: pixelated; display: block; border-bottom: 6px solid #d0702e; }
</style>
</head>
<body>
<h1>구름이·노을이 새 옷 + 손 든 점프 시안</h1>
<p>목도리를 빼고 원래 목도리 색으로 모자와 멜빵 반바지를 입혔어요. 점프는 옆모습에 앞으로 주먹을 번쩍 든 자세예요.</p>
<div id="out"></div>
<script src="../assets/hero.js"></script>
<script>
  const POSES = [['idle', 0, '서기'], ['walk', 0, '걷기 1'], ['walk', 1, '걷기 2'], ['jump', 0, '점프'], ['cheer', 0, '만세'], ['surprised', 0, '깜짝'], ['sleep', 0, '잠']];
  const out = document.getElementById('out');
  [['예전 (목도리)', false], ['새 옷 (모자 + 멜빵)', true]].forEach(([title, fit]) => {
    ['gureum', 'noeul'].forEach((kind) => {
      window.HERO_OUTFIT = fit;
      const sec = document.createElement('div');
      sec.className = 'sec';
      sec.innerHTML = `<h2>${title} · ${kind === 'gureum' ? '구름이' : '노을이'}</h2><div class="row"></div>`;
      const row = sec.querySelector('.row');
      POSES.forEach(([pose, i, name]) => {
        const f = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = 32; c.height = 36;
        window.foxFrame(kind, pose, i, c);
        f.append(c, name);
        row.appendChild(f);
      });
      out.appendChild(sec);
    });
  });
  window.HERO_OUTFIT = null;
</script>
</body>
</html>
